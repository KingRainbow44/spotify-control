[package]
name = "spotify-control"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
clap = { version = "4.6.3", features = ["derive"] }
dirs = "6.0.0"
global-hotkey = "0.8.0"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "form", "query", "http2", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webbrowser = "1.2.1"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Console"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8.7"
